name: v402-patch

on:
  push:
    branches:
      - fix/v4.0.2-http-reliability

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: stage v4.0.2 patch runner'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/v4.0.2-http-reliability
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Apply v4.0.2 reliability patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing patch anchor: {label}")
              return text.replace(old, new, 1)

          client_path = Path('pkg/httpclient/client.go')
          client = client_path.read_text()
          client = replace_once(
              client,
              '\tstart := time.Now()\n\texpectNoBody := requestExpectsNoResponseBody(rawRequest)\n',
              '\tstart := time.Now()\n\texpectNoBody := requestExpectsNoResponseBody(rawRequest)\n\treplaySafe := requestReplaySafe(rawRequest)\n',
              'raw replay policy',
          )

          helpers_anchor = '''func responseHasNoBody(expectNoBody bool, statusCode int) bool {
'''
          helpers = r'''func requestMethod(rawRequest []byte) string {
	lineEnd := bytes.IndexByte(rawRequest, '\n')
	if lineEnd == -1 {
		lineEnd = len(rawRequest)
	}
	fields := bytes.Fields(rawRequest[:lineEnd])
	if len(fields) == 0 {
		return ""
	}
	return strings.ToUpper(string(fields[0]))
}

func requestReplaySafe(rawRequest []byte) bool {
	switch requestMethod(rawRequest) {
	case http.MethodGet, http.MethodHead, http.MethodOptions, http.MethodTrace:
		return true
	default:
		return false
	}
}

func stopConnOnContextDone(ctx context.Context, conn net.Conn) func() {
	if ctx == nil || conn == nil || ctx.Done() == nil {
		return func() {}
	}
	stop := context.AfterFunc(ctx, func() {
		_ = conn.Close()
	})
	return func() {
		_ = stop()
	}
}

func parseConsistentContentLength(values []string) (int, error) {
	want := -1
	for _, raw := range values {
		value := strings.TrimSpace(raw)
		if value == "" {
			return -1, fmt.Errorf("empty Content-Length value")
		}
		n, err := strconv.Atoi(value)
		if err != nil || n < 0 {
			return -1, fmt.Errorf("invalid Content-Length value %q", value)
		}
		if want == -1 {
			want = n
			continue
		}
		if n != want {
			return -1, fmt.Errorf("conflicting Content-Length values: %d and %d", want, n)
		}
	}
	return want, nil
}

func transferEncodingChunkedFinal(value string) (bool, error) {
	parts := strings.Split(value, ",")
	if len(parts) == 0 {
		return false, fmt.Errorf("empty Transfer-Encoding")
	}
	seenChunked := false
	for i, raw := range parts {
		coding := strings.ToLower(strings.TrimSpace(strings.SplitN(raw, ";", 2)[0]))
		if coding == "" {
			return false, fmt.Errorf("invalid empty Transfer-Encoding coding")
		}
		if coding == "chunked" {
			if seenChunked || i != len(parts)-1 {
				return false, fmt.Errorf("invalid Transfer-Encoding: chunked must appear exactly once and as the final coding")
			}
			seenChunked = true
		}
	}
	return seenChunked, nil
}

