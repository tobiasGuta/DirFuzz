name: v402-patch

on:
  push:
    branches:
      - fix/v4.0.2-http-reliability

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/v4.0.2-http-reliability
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Recover and apply staged patch
        shell: bash
        run: |
          git show HEAD^^^:.github/workflows/v402-patch.yml > /tmp/v402-old.yml
          python <<'PY'
          from pathlib import Path
          text = Path('/tmp/v402-old.yml').read_text()
          start_marker = "          python <<'PY'\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index("\n          PY\n", start)
          block = text[start:end]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          Path('/tmp/v402_patch.py').write_text('\n'.join(lines) + '\n')
          PY
          python /tmp/v402_patch.py
          gofmt -w pkg/httpclient/client.go pkg/httpclient/reliability_v402_test.go pkg/engine/engine_request.go pkg/engine/worker.go pkg/engine/reliability_v402_test.go cmd/dirfuzz/flags.go
          rm .github/workflows/v402-patch.yml
      - name: Focused tests
        run: go test ./pkg/httpclient ./pkg/engine -run 'V402|V401|ChangeWordlistConcurrency' -count=5 -timeout=3m
      - name: Full tests
        run: go test ./... -timeout=8m
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race ./pkg/httpclient ./pkg/engine -timeout=10m
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden v4.0.2 HTTP reliability [skip ci]"
          git push origin HEAD:fix/v4.0.2-http-reliability
