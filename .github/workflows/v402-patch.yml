func TestV402ReplayPolicy(t *testing.T) {
	tests := []struct {
		method string
		want   bool
	}{
		{"GET", true}, {"HEAD", true}, {"OPTIONS", true}, {"TRACE", true},
		{"POST", false}, {"PATCH", false}, {"PUT", false}, {"DELETE", false},
