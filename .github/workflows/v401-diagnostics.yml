name: v4.0.1 diagnostics

on:
  push:
    branches:
      - fix/v4.0.1-reliability

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect submission accounting
        shell: bash
        run: |
          echo '===== Submit definitions ====='
          grep -R -n -B4 -A30 'func (e \*Engine) Submit' pkg/engine || true
          echo '===== activeJobs Add/Done sites ====='
          grep -R -n -B5 -A10 'activeJobs\.Add\|activeJobs\.Done\|activeJobs\.Wait' pkg/engine || true
          echo '===== ChangeWordlist ====='
          grep -n -A150 'func (e \*Engine) ChangeWordlist' pkg/engine/engine.go
